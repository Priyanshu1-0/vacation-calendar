# Optional Render Blueprint: New → Blueprint → connect repo
services:
  - type: web
    name: vacation-calendar-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CALENDAR_DEFAULT_YEAR
        value: "2026"
      - key: CALENDARIFIC_API_KEY
        sync: false
